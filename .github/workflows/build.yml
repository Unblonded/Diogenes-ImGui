name: Build

# Every push builds the app for Macs (Apple silicon and Intel) and Windows, and publishes the zips as a
# GitHub Release: v1.3.<run number> for a branch push, or the tag's own name when a tag like v2.0.0 is pushed.
# Pull requests only build.
on:
  push:
    branches: [windows, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.3.{0}', github.run_number) }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 32-bit on purpose: J2534 adapter drivers are almost always 32-bit
      - name: Publish
        run: >
          dotnet publish DiogenesImGui/DiogenesImGui.csproj
          -c Release -r win-x86 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath DiogenesImGui-win-x86.zip
          Get-ChildItem publish | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DiogenesImGui-win-x86
          path: DiogenesImGui-win-x86.zip

  build-mac:
    # macos-14 runners are Apple silicon
    runs-on: macos-14
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build app bundle
        run: |
          VERSION="${RELEASE_TAG#v}" mac/build-app.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: DiogenesImGui-${{ matrix.rid }}
          path: DiogenesImGui-${{ matrix.rid }}.zip

  release:
    if: github.event_name != 'pull_request'
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Built from `${{ github.ref_name }}` (${{ github.sha }}).

          **Mac:** `DiogenesImGui-osx-arm64.zip` for M chips (M1/M2/M3/M4), `DiogenesImGui-osx-x64.zip` for Intel. Unzip, move Diogenes.app to Applications, and the first time right-click it and choose Open (it is not notarized). For an OpenPort 2.0 cable install its driver first: `brew install bisak/tap/openport-j2534`.

          **Windows:** download `DiogenesImGui-win-x86.zip`, unzip it, and run DiogenesImGui.exe. Keep glfw3.dll and cimgui.dll next to the exe.

          No .NET install needed. CBF files are not included.
          EOF
          gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Diogenes ImGui $RELEASE_TAG" --notes-file notes.md \
            DiogenesImGui-osx-arm64.zip DiogenesImGui-osx-x64.zip DiogenesImGui-win-x86.zip
